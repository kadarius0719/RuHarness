[package]
name = "harness-oracle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RuHarness oracle strategies (c-abi-differential)"

[dependencies]
# serde_json: parsing the benchmark scorer's report (already a workspace dep).
serde_json.workspace = true
# toml: reading a unit crate's manifest before cargo runs on it (the
# unit-crate check, docs/PROJECT-MAP-DESIGN.md §3.7); already a workspace dep
# (harness-core's config), so no crate is added to the tree.
toml.workspace = true
# serde (derive): reading the project map's `config.toml` entries and writing
# the configuration's canonical JSON for its digest; already a workspace dep
# (harness-core), so no crate is added to the tree.
serde.workspace = true
harness-core.workspace = true
# Workspace path dependency (no crates.io addition): the oracle needs exactly
# two pure functions of the C frontend — `mutants` (mutation sites for
# driver validation, M4 R5) and `lint_driver` (the driver-shape source lint,
# M4 R1) — so tree-sitter C parsing keeps a single owner.
harness-scan.workspace = true
