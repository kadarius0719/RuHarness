[package]
name = "harness-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A stdio MCP server: the ledger as structured data and the labelled review acts, for an agent runtime"

[[bin]]
name = "harness-mcp"
path = "src/main.rs"

[dependencies]
harness-core.workspace = true
# The read model, the events reader and the child process — no terminal crates.
harness-tui = { path = "../harness-tui", default-features = false }
serde_json.workspace = true
signal-hook.workspace = true
# Workspace path dependencies (no crates.io addition; DECISIONS 2026-10-19):
# the cockpit's chat answers the project map's open question through
# `harness_map_questions` and `harness_map_answer`, which must send exactly
# what `harness project ask` sends and record through exactly its
# validators — harness-llm's `projectask` holds both (its live adapters are
# never called here), and harness-oracle the path check a proposed flag
# passes (`projectmap::config::check_flags`) and the build-file rule.
harness-llm.workspace = true
harness-oracle.workspace = true
