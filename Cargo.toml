[workspace]
resolver = "2"
members = ["crates/harness-core", "crates/harness-scan", "crates/harness-oracle", "crates/harness-cli"]
# Migration unit crates are deliberately NOT workspace members: a half-scaffolded
# in-progress unit must never break the harness's own tooling (docs/SCHEMAS.md).
exclude = ["targets"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-scan = { path = "crates/harness-scan" }
harness-oracle = { path = "crates/harness-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
blake3 = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
