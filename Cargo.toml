[workspace]
resolver = "2"
members = ["crates/harness-core", "crates/harness-scan", "crates/harness-detect", "crates/harness-llm", "crates/harness-oracle", "crates/harness-cli", "crates/harness-tui"]
# A plain `cargo build` at the root stays lean: the review cockpit (and its
# terminal stack) builds only when asked for, or under --workspace (CI).
default-members = ["crates/harness-core", "crates/harness-scan", "crates/harness-detect", "crates/harness-llm", "crates/harness-oracle", "crates/harness-cli"]
# Migration unit crates are deliberately NOT workspace members: a half-scaffolded
# in-progress unit must never break the harness's own tooling (docs/SCHEMAS.md).
exclude = ["targets"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
harness-core = { path = "crates/harness-core" }
harness-scan = { path = "crates/harness-scan" }
harness-oracle = { path = "crates/harness-oracle" }
harness-detect = { path = "crates/harness-detect" }
harness-llm = { path = "crates/harness-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
blake3 = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
signal-hook = "0.4"
tree-sitter-rust = "0.24"
unicode-width = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
similar = "3"
tree-sitter-highlight = "0.27"
