# Standalone crate: built by the oracle via --manifest-path, never part of the
# harness workspace (docs/SCHEMAS.md — a broken unit must not brick the tooling).
[package]
name = "katajainen_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust migration of zopfli's katajainen.c (unit u001), identical C ABI"

[lib]
crate-type = ["staticlib", "rlib"]

[workspace]
